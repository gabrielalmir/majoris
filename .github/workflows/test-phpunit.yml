name: PHPUnit

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-24.04
    if: "!contains(github.event.head_commit.message, '[ci skip]')"
    env:
      PHP_INI_VALUES: assert.exception=1, zend.assertions=1

    strategy:
      fail-fast: false
      matrix:
        php: [ '8.5', '7.4' ]
        DB: [ 'pdo/mysql', 'pdo/pgsql', 'pdo/sqlite', 'mysqli', 'pgsql', 'sqlite' ]

    services:
      postgres:
        image: postgres:12
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ci_test
        ports:
          - 5432:5432
        options: --health-cmd=pg_isready --health-interval=10s --health-timeout=5s --health-retries=3

      mysql:
        image: mysql:5.7
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: true
          MYSQL_USER: travis
          MYSQL_PASSWORD: travis
          MYSQL_DATABASE: ci_test
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install PHP${{ matrix.php }} - DB ${{ matrix.DB }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer, pecl
          extensions: imagick, sqlite3, pgsql, mysqli, pdo, pdo_mysql, pdo_pgsql, pdo_sqlite, mbstring
          ini-values: ${{ env.PHP_INI_VALUES }}
          coverage: none

      - name: Get composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT
      - name: Cache composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-php${{ matrix.php }}-composer-${{ hashFiles('**/composer.json') }}
          restore-keys: ${{ runner.os }}-php${{ matrix.php }}-composer-
      - name: Install composer dependencies
        run: composer update --no-progress --prefer-dist --optimize-autoloader

      - name: PHPUnit Test
        run: |
          php -d error_reporting=E_ALL -d zend.enable_gc=0 -d date.timezone=UTC vendor/bin/phpunit --configuration tests/travis/${{ matrix.DB }}.phpunit.xml

  sqlsrv:
    name: SQL Server 2019 - PHP${{ matrix.php }} - ${{ matrix.driver }}
    runs-on: ubuntu-24.04
    if: "!contains(github.event.head_commit.message, '[ci skip]')"
    env:
      PHP_INI_VALUES: assert.exception=1, zend.assertions=1
      SQLSRV_HOST: localhost
      SQLSRV_USER: sa
      SQLSRV_PASSWORD: CI_sqlsrv_2019
      SQLSRV_DATABASE: ci_test

    strategy:
      fail-fast: false
      matrix:
        php: [ '7.4', '8.5' ]
        driver: [ 'sqlsrv', 'pdo/sqlsrv' ]

    services:
      mssql:
        image: mcr.microsoft.com/mssql/server:2019-latest
        env:
          ACCEPT_EULA: Y
          MSSQL_PID: Developer
          MSSQL_SA_PASSWORD: CI_sqlsrv_2019
        ports:
          - 1433:1433
        options: >-
          --health-cmd="if [ -x /opt/mssql-tools18/bin/sqlcmd ]; then /opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P CI_sqlsrv_2019 -b -Q 'SELECT 1'; else /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P CI_sqlsrv_2019 -b -Q 'SELECT 1'; fi"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
          --health-start-period=20s

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install ODBC Driver 18 for SQL Server
        run: |
          if ! dpkg -s packages-microsoft-prod > /dev/null 2>&1; then
            curl -sSL -o /tmp/packages-microsoft-prod.deb "https://packages.microsoft.com/config/ubuntu/$(. /etc/os-release && echo "$VERSION_ID")/packages-microsoft-prod.deb"
            sudo dpkg -i /tmp/packages-microsoft-prod.deb
          fi
          sudo apt-get update
          sudo ACCEPT_EULA=Y apt-get install -y msodbcsql18 mssql-tools18 unixodbc-dev

      - name: Install PHP${{ matrix.php }} - DB ${{ matrix.driver }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer, pecl
          extensions: pdo, mbstring, ${{ matrix.php == '7.4' && 'sqlsrv-5.10.1, pdo_sqlsrv-5.10.1' || 'sqlsrv, pdo_sqlsrv' }}
          ini-values: ${{ env.PHP_INI_VALUES }}
          coverage: none

      - name: Get composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT
      - name: Cache composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-php${{ matrix.php }}-composer-${{ hashFiles('**/composer.json') }}
          restore-keys: ${{ runner.os }}-php${{ matrix.php }}-composer-
      - name: Install composer dependencies
        run: composer update --no-progress --prefer-dist --optimize-autoloader

      - name: Create the ci_test database
        run: /opt/mssql-tools18/bin/sqlcmd -C -S "$SQLSRV_HOST" -U "$SQLSRV_USER" -P "$SQLSRV_PASSWORD" -b -Q "IF DB_ID('$SQLSRV_DATABASE') IS NULL CREATE DATABASE [$SQLSRV_DATABASE]"

      - name: PHPUnit Test
        run: |
          php --ri ${{ matrix.driver == 'sqlsrv' && 'sqlsrv' || 'pdo_sqlsrv' }}
          php -d error_reporting=E_ALL -d zend.enable_gc=0 -d date.timezone=UTC vendor/bin/phpunit --configuration tests/travis/${{ matrix.driver }}.phpunit.xml
