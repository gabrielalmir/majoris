name: Check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install PHP 7.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4'
          tools: composer
          extensions: sqlite3, mbstring
          coverage: none

      - name: Install dependencies
        run: composer update --no-progress --prefer-dist --no-interaction

      - name: Check
        run: composer lint && composer stan
